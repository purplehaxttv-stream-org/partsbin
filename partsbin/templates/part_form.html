{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit part' if part else 'Add part' }}</h1>
<form method="post" class="card">
    <div class="form-grid">
        <label for="name">Name</label>
        <input id="name" name="name" required list="names" value="{{ part.name if part }}">

        <label for="category">Category</label>
        <input id="category" name="category" list="cats" value="{{ part.category if part }}">

        <label for="qty">Quantity</label>
        <input id="qty" name="qty" type="number" min="0" value="{{ part.qty if part else 1 }}">

        <label for="location_id">Location</label>
        <select id="location_id" name="location_id">
            <option value="">(none)</option>
            {% for l in locations %}
            <option value="{{ l.id }}" {{ 'selected' if part and part.location_id == l.id }}>{{ l.name }}</option>
            {% endfor %}
        </select>

        <label for="tags">Tags</label>
        <input id="tags" name="tags" placeholder="comma separated: i2c, 5v, analog" value="{{ part.tags if part }}">

        <label for="link">Link</label>
        <input id="link" name="link" placeholder="datasheet / pinout URL" value="{{ part.link if part }}">

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes">{{ part.notes if part }}</textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Save</button>
        <a href="{{ url_for('index') }}">cancel</a>
    </div>
</form>
{% if part %}
<form method="post" action="{{ url_for('part_delete', part_id=part.id) }}" onsubmit="return confirm('Delete {{ part.name }}?')">
    <button type="submit" class="btn-danger">Delete part</button>
</form>
{% endif %}
<datalist id="names">{% for n in names %}<option value="{{ n }}">{% endfor %}</datalist>
<datalist id="cats">{% for c in categories %}<option value="{{ c }}">{% endfor %}</datalist>
{% endblock %}
